name: Build SixDegrees

on:
  push:
    branches:
      - main
      - enhanced-reports
      - 'cursor/**'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Set Short SHA
        id: sha
        run: echo "SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set safe ref slug
        id: refslug
        run: echo "SAFE_REF=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mkdir -p app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/sixdegrees-${{ steps.sha.outputs.SHORT_SHA }}-debug.apk"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.refslug.outputs.SAFE_REF }}-${{ steps.sha.outputs.SHORT_SHA }}
          name: "SixDegrees ${{ github.ref_name }} @ ${{ steps.sha.outputs.SHORT_SHA }}"
          body: "Automated build from commit ${{ github.sha }}"
          files: app/build/outputs/apk/debug/sixdegrees-*.apk
          prerelease: ${{ github.ref_name != 'main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify APK ready (ntfy)
        if: success() && github.event_name == 'push'
        run: |
          MSG="Download: https://github.com/${{ github.repository }}/releases/tag/build-${{ steps.refslug.outputs.SAFE_REF }}-${{ steps.sha.outputs.SHORT_SHA }}"
          curl -s -H "Title: 6Degrees APK Ready" \
            -H "Tags: package" \
            -H "Priority: high" \
            -d "$MSG" \
            https://ntfy.sh/twskoops
          curl -s -H "Title: 6Degrees APK Ready" \
            -H "Tags: package" \
            -H "Priority: high" \
            -d "$MSG" \
            https://ntfy.sh/twoskoops707-6degrees-apk
          curl -s -H "Title: 6Degrees APK Ready" \
            -H "Tags: package" \
            -H "Priority: urgent" \
            -d "$MSG" \
            https://ntfy.sh/707333177
